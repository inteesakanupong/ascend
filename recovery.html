<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ascend Recovery</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f5f4f0;
    color: #111110;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    width: min(360px, calc(100vw - 32px));
    border: 1px solid #dddcd7;
    background: #fff;
    padding: 22px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    line-height: 1.1;
  }
  p {
    margin: 0;
    color: #5a5a55;
    line-height: 1.45;
    font-size: 14px;
  }
</style>
</head>
<body>
<main>
  <h1>Refreshing Ascend</h1>
  <p>Clearing the old local app cache and reopening the fixed build.</p>
</main>
<script>
(async function recoverAscend() {
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(reg => reg.unregister()));
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.filter(key => key.startsWith("ascend-")).map(key => caches.delete(key)));
    }
  } catch (err) {
    console.warn("Ascend recovery cache clear failed", err);
  }
  location.replace("./index.html?v=2026-05-17.16&recovered=1");
})();
</script>
</body>
</html>
